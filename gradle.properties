org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official

# Roborazzi screenshot tests (docs/development/screenshot-testing.md). Passed to the test JVM only
# during record/verify/compare runs. Half-size images keep the committed goldens small, and
# ClassName.method.png file names keep them readable.
roborazzi.record.resizeScale=0.5
roborazzi.record.namingStrategy=testClassAndMethod

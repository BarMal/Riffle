complexity:
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8

style:
  ForbiddenImport:
    active: true
    imports:
      - value: 'kotlinx.coroutines.runBlocking'
        reason: 'Blocks the calling thread, usually main. Keep state in memory; persist from a background scope.'
    excludes: ['**/test/**', '**/androidTest/**', '**/testFixtures/**']
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - Preview

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - Composable

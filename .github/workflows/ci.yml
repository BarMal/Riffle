name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.sha }}
  cancel-in-progress: true

jobs:
  headless-verify:
    name: Headless verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run release contract tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0
          Invoke-Pester .github/scripts/test -CI -Output Detailed

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: ./gradlew verify

  device-verify:
    name: Device verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew deviceVerify

  screenshots:
    # Renders every JVM screenshot test and uploads the PNGs so each PR has reviewable images.
    # Record-only (not a merge gate) until goldens are committed; then CI turns comparison on with
    # -Priffle.screenshots.verify=true. See docs/development/screenshot-testing.md.
    name: Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record screenshots
        run: >-
          ./gradlew
          :app:testDebugUnitTest --tests 'com.riffle.app.screenshots.*'
          :app:recordRoborazziDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload screenshot test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

  verify:
    name: Verify
    if: always()
    needs:
      - headless-verify
      - device-verify
    runs-on: ubuntu-latest

    steps:
      - name: Require headless and device verification
        run: |
          test "${{ needs.headless-verify.result }}" = success
          test "${{ needs.device-verify.result }}" = success
